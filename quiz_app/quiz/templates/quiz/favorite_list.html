{% extends 'quiz/base.html' %}
{% block content %}
<div class="container py-4">
    <h2 class="mb-4 text-gradient"><i class="bi bi-star-fill text-warning me-2"></i>Улюблені вікторини</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for category in categories %}
            <div class="col">
                <div class="card card-custom h-100 p-3 d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="fw-bold text-white">{{ category.name }}</h5>
                        <p class="text-secondary">{{ category.description|default:"Без опису"|truncatechars:80 }}</p>
                    </div>
                    <div class="d-flex gap-2 mt-3">
                        <a href="{% url 'quiz:quiz_detail' category.id %}" class="btn btn-gradient flex-fill">Пройти</a>
                        <a href="{% url 'quiz:toggle_favorite' category.id %}" class="btn btn-outline-danger" title="Видалити з улюблених">
                            <i class="bi bi-star-fill"></i>
                        </a>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12 text-center text-secondary py-5">
                <i class="bi bi-star fs-1 d-block mb-2"></i>
                У вас поки немає збережених улюблених вікторин.
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
