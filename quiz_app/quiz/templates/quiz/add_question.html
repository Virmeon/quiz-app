<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати питання — {{ category.name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; }
        .glass-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
    </style>
</head>
<body class="py-5">
<div class="container" style="max-width: 700px;">
    <div class="glass-card p-4 shadow-lg">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0">Додання питання #{{ question_count|add:1 }}</h4>
            <span class="badge bg-secondary">Квіз: {{ category.name }}</span>
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary">Текст питання</label>
                {{ q_form.text }}
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary">Картинка (необов'язково)</label>
                {{ q_form.image }}
            </div>

            <h6 class="fw-bold text-white mb-3">Варіанти відповідей (позначте правильний):</h6>
            {% for i in "0123" %}
                <div class="input-group mb-3">
                    <div class="input-group-text bg-dark border-secondary">
                        <input class="form-check-input mt-0" type="radio" name="correct_answer" value="{{ forloop.counter0 }}" {% if forloop.first %}checked{% endif %}>
                    </div>
                    <input type="text" name="answers" class="form-control bg-dark text-light border-secondary" placeholder="Варіант {{ forloop.counter }}" required>
                </div>
            {% endfor %}

            <div class="d-flex gap-2 mt-4">
                <button type="submit" name="add_more" class="btn btn-outline-primary w-50">+ Додати ще питання</button>
                <button type="submit" name="finish" class="btn btn-success w-50">Завершити та зберегти</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
