<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>QuizApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-custom {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            backdrop-filter: blur(8px);
            color: #f8fafc;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            color: #fff;
            border-radius: 12px;
            font-weight: 600;
            padding: 8px 16px;
        }
        .btn-gradient:hover {
            opacity: 0.9;
            color: #fff;
        }
        .text-gradient {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-gradient" href="{% url 'quiz:category_list' %}">
            <i class="bi bi-controller me-2"></i>QuizApp
        </a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link me-3" href="{% url 'quiz:category_list' %}">Категорії</a>
            {% if user.is_authenticated %}
                <a class="nav-link me-3" href="{% url 'quiz:favorite_list' %}"><i class="bi bi-star-fill text-warning me-1"></i>Улюблені</a>
                <a class="btn btn-gradient btn-sm rounded-pill px-3 me-3" href="{% url 'quiz:create_quiz' %}">
                    <i class="bi bi-plus-lg me-1"></i> Створити квіз
                </a>
                <a class="nav-link me-3" href="{% url 'quiz:profile' %}">Мій профіль</a>
                <form action="{% url 'quiz:logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3">Вийти</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm rounded-pill px-3 me-2" href="{% url 'quiz:login' %}">Увійти</a>
                <a class="btn btn-primary btn-sm rounded-pill px-3" href="{% url 'quiz:register' %}">Реєстрація</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container py-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
