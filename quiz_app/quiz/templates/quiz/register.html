<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; }
        .glass-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
    </style>
</head>
<body class="d-flex align-items-center py-5">
<div class="container" style="max-width: 450px;">
    <div class="glass-card p-4 shadow-lg">
        <h3 class="fw-bold mb-4 text-center">Створити акаунт</h3>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label text-secondary">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.name }}" class="form-control bg-dark text-light border-secondary" required>
                    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100 mt-3">Зареєструватися</button>
        </form>
        <p class="text-center text-secondary mt-3 mb-0">Вже є акаунт? <a href="{% url 'quiz:login' %}" class="text-primary">Увійти</a></p>
    </div>
</div>
</body>
</html>
