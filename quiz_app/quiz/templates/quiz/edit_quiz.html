{% extends 'quiz/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-custom p-4 shadow-lg">
            <h2 class="mb-4 text-gradient text-center">Редагувати вікторину</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-gradient w-100 mt-3">Зберегти зміни</button>
                <a href="{% url 'quiz:category_list' %}" class="btn btn-outline-light w-100 mt-2">Скасувати</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
