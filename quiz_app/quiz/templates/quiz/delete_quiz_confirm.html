{% extends 'quiz/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card card-custom p-4 text-center shadow-lg border-danger">
            <h3 class="text-danger mb-3"><i class="bi bi-exclamation-triangle-fill me-2"></i>Видалити вікторину?</h3>
            <p class="text-secondary">Ви дійсно хочете видалити <strong>"{{ category.name }}"</strong>? Цю дію неможливо скасувати.</p>
            <form method="post" class="mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">Так, видалити</button>
                <a href="{% url 'quiz:category_list' %}" class="btn btn-outline-light w-100">Скасувати</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
