<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; }
        .glass-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
    </style>
</head>
<body class="d-flex align-items-center py-5">
<div class="container" style="max-width: 450px;">
    <div class="glass-card p-4 shadow-lg">
        <h3 class="fw-bold mb-4 text-center">Вхід у систему</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary">Ім'я користувача</label>
                <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary">Пароль</label>
                <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Увійти</button>
        </form>
        <p class="text-center text-secondary mt-3 mb-0">Немає акаунта? <a href="{% url 'quiz:register' %}" class="text-primary">Зареєструватися</a></p>
    </div>
</div>
</body>
</html>
